[workspace]
members = ["crates/wsdist-core", "crates/wsdist-app", "crates/wsdist-fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
wsdist-fixtures = { path = "crates/wsdist-fixtures" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
csv = "1"
rayon = "1"
rand_chacha = { version = "=0.9.0", default-features = false }
getrandom = "0.3"
sha2 = "0.10"
xxhash-rust = { version = "=0.8.15", default-features = false, features = ["xxh3"] }
tempfile = "3"
mimalloc = { version = "=0.1.48", default-features = false }
parking_lot = "0.12"
slint = { version = "=1.16.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
fontique = { version = "=0.8.0", default-features = false, features = ["system"] }
slint-build = "=1.16.0"
i-slint-backend-testing = "=1.16.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
plotters = { version = "=0.3.7", default-features = false, features = ["bitmap_backend", "line_series", "ttf"] }
winresource = "=0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep fixture ingestion efficient without optimizing the parity/test targets.
[profile.dev.package.wsdist-fixtures]
opt-level = 3

[profile.dev.package.xxhash-rust]
opt-level = 3

# Optimize the verification executables' allocator, including its native C code.
[profile.dev.package.mimalloc]
opt-level = 3

[profile.dev.package.libmimalloc-sys]
opt-level = 3

[profile.test.package.serde_json]
opt-level = 3

# Optimize native sampling without optimizing core calculation or parity code.
[profile.test.package.rand_chacha]
opt-level = 3
